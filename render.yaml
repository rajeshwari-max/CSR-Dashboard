# Render blueprint — commit this, then "New > Blueprint" in the Render dashboard
# and point it at the repository. Everything below is provisioned automatically.
services:
  - type: web
    name: cms-csr
    runtime: docker
    plan: starter            # 512 MB RAM; enough for a ~4 MB dataset
    region: singapore        # closest Render region to India
    healthCheckPath: /api/meta
    autoDeploy: true
    disk:
      name: csr-data
      mountPath: /var/data   # matches CSR_DATA_DIR in the Dockerfile
      sizeGB: 1
    envVars:
      - key: CSR_DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false          # set this in the Render dashboard, not in git
      - key: RESEND_API_KEY
        sync: false          # required for user OTP emails
      - key: OTP_FROM_EMAIL
        sync: false          # sender on a verified email domain
      - key: ADMIN_EMAIL
        sync: false          # receives new registration notices
      - key: AUTH_EMAIL_OTP
        value: required      # "off" = approved users sign in with email + password only
      # APP_BASE_URL is optional: links in emails default to RENDER_EXTERNAL_URL,
      # which Render sets automatically. Set it only when using a custom domain.
      - key: LLM_API_KEY
        sync: false          # optional — enables AI narration and chat
      - key: LLM_PROVIDER
        value: anthropic
